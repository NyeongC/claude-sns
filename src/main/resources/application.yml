spring:
  application:
    name: sns-project
  datasource:
    url: jdbc:postgresql://localhost:5432/sns
    driver-class-name: org.postgresql.Driver
    username: sns
    password: sns123
    hikari:
      maximum-pool-size: 5
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
    redis:
      namespace: sns:session
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  data:
    default-password: "1234"
